<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
</head>

<body>

    <center>

        <legend>

            <h1 style="color: blue;">
                Simple Interest Calculator
            </h1>

            <form method="POST">

                <input type="number"
                       step="any"
                       name="p"
                       placeholder="Principal Amount"
                       required>

                <input type="number"
                       step="any"
                       name="t"
                       placeholder="Time"
                       required>

                <input type="number"
                       step="any"
                       name="r"
                       placeholder="Rate"
                       required>

                <button type="submit">
                    Calculate Interest
                </button>

            </form>

            {# Display output #}

            {% if result is defined %}

                <hr>

                <h3>Result</h3>

                <span>Principal: {{ p }}</span>
                <br><br>

                <span>Rate: {{ r }}</span>
                <br><br>

                <span>Time: {{ t }}</span>
                <br><br>

                <span>
                    <b>₹ Simple Interest - {{ result }}</b>
                    <br><br>

                    <b>₹ Total Amount - {{ total }}</b>
                </span>

            {% endif %}

        </legend>

    </center>

</body>

</html>
